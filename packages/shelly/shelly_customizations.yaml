    # Energy Meter B
    sensor.shelly_em_energy_meter_1_potenza:
      friendly_name: Potenza
    sensor.shelly_em_energy_meter_1_energia:
      friendly_name: Energia
    sensor.shelly_em_energy_meter_1_energia_cost:
      friendly_name: Costo Energia
