######################################################################
# Shelly Package - Customization
######################################################################

homeassistant:
  customize:

    # Shelly EM Gen4 (ACEBE6C8F2D8)
    switch.shelly_em:
      friendly_name: Pulsante
    update.shelly_em_firmware:
      friendly_name: Aggiornamento Firmware
